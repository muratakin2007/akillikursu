<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akıllı Kürsü - Eğitim ve Bilgisayar Uygulamaları</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Mobil cihazlarda yatayda taşmayı önlemek ve daha şık kaydırma için */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <span class="text-2xl select-none">👨‍🏫</span>
                <h1 class="text-lg md:text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                    Akıllı Kürsü
                </h1>
            </div>
            <div class="text-xs md:text-sm text-slate-500 font-medium bg-slate-100 px-2.5 py-1 rounded-full md:bg-transparent md:p-0">
                Dijital Araçlar
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 md:py-12 flex-grow w-full">
        
        <div class="text-center mb-8 md:mb-12">
            <h2 class="text-2xl md:text-4xl font-extrabold text-slate-900 tracking-tight mb-3 px-2">
                Eğitimi Kolaylaştıran Çözümler
            </h2>
            <p class="text-sm md:text-lg text-slate-600 max-w-2xl mx-auto px-4 leading-relaxed">
                Öğretmenlerin ve okul bilgisayarlarının ihtiyaçlarına yönelik geliştirdiğim pratik web ve sistem uygulamaları.
            </p>
        </div>

        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200/80 mb-6 md:mb-10 space-y-4 md:space-y-6">
            
            <div class="relative max-w-xl mx-auto w-full">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input 
                    type="text" 
                    id="searchBar" 
                    inputmode="search"
                    placeholder="Uygulama adı veya açıklama ara..." 
                    class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-sm placeholder-slate-400"
                >
            </div>

            <div class="w-full overflow-x-auto no-scrollbar -mx-4 px-4 md:mx-0 md:px-0">
                <div class="flex flex-nowrap md:flex-wrap md:justify-center gap-2 pb-1" id="categoryContainer">
                    <button onclick="filterCategory('Tümü')" class="cat-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs md:text-sm font-medium bg-blue-600 text-white shadow-sm transition-all touch-manipulation">
                        Tümü
                    </button>
                    </div>
            </div>
        </div>

        <div id="projectsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
            <div class="col-span-full text-center py-12 text-slate-400">
                <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Projeler yükleniyor...
            </div>
        </div>

        <div id="noResults" class="hidden text-center py-12 px-4">
            <span class="text-4xl">🔍</span>
            <p class="text-slate-500 mt-3 font-medium text-sm md:text-base">Aradığınız kriterlere uygun uygulama bulunamadı.</p>
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 py-5 text-center text-xs md:text-sm text-slate-400">
        <p>&copy; 2026 Akıllı Kürsü. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        // Aynı dizindeki JSON dosyanızın adı
        const jsonUrl = 'projeler.json'; 
        
        let allProjects = [];
        let activeCategory = 'Tümü';

        // 1. JSON Verisini Çekme
        async function fetchProjects() {
            try {
                const response = await fetch(jsonUrl);
                allProjects = await response.json();
                
                generateCategoryButtons();
                renderProjects(allProjects);
            } catch (error) {
                console.error('Veri çekilirken hata oluştu:', error);
                document.getElementById('projectsGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500 font-medium text-sm">
                        ❌ Uygulamalar listelenemedi. Lütfen internet bağlantınızı kontrol edin.
                    </div>`;
            }
        }

        // 2. Projeleri Mobil Uyumlu Kartlar Olarak Ekrana Basma
        function renderProjects(projects) {
            const grid = document.getElementById('projectsGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (projects.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            projects.forEach(project => {
                const card = document.createElement('div');
                // Mobil için padding ayarları p-5, md ekranlar için p-6 yapıldı
                card.className = 'bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm active:scale-[0.99] md:hover:scale-[1.01] md:hover:shadow-md md:hover:border-slate-300 transition-all flex flex-col justify-between group';
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3.5">
                            <span class="text-2xl p-2.5 bg-slate-50 rounded-xl group-hover:bg-blue-50 transition-colors select-none">${project.ikon || '🚀'}</span>
                            <span class="text-[11px] font-semibold px-2.5 py-0.5 bg-slate-100 text-slate-600 rounded-full">${project.kategori}</span>
                        </div>
                        <h3 class="text-base md:text-lg font-bold text-slate-900 mb-1.5 group-hover:text-blue-600 transition-colors">
                            ${project.adi}
                        </h3>
                        <p class="text-slate-600 text-xs md:text-sm leading-relaxed mb-5">
                            ${project.aciklama}
                        </p>
                    </div>
                    <a href="${project.url}" target="_blank" class="w-full inline-flex items-center justify-center px-4 py-3 bg-slate-50 active:bg-blue-600 md:hover:bg-blue-600 text-slate-700 active:text-white md:hover:text-white font-semibold text-xs md:text-sm rounded-xl border border-slate-200 active:border-blue-600 md:hover:border-blue-600 transition-all shadow-sm touch-manipulation">
                        Uygulamaya Git
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        // 3. Kategorileri Mobilde Kayabilir Şerit Yapacak Şekilde Üretme
        function generateCategoryButtons() {
            const container = document.getElementById('categoryContainer');
            const categories = ['Tümü', ...new Set(allProjects.map(p => p.kategori))];
            
            container.innerHTML = '';
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.textContent = cat;
                // Mobilde yan yana kırılmaması için whitespace-nowrap eklendi
                btn.className = `cat-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs md:text-sm font-medium transition-all touch-manipulation ${
                    cat === activeCategory 
                    ? 'bg-blue-600 text-white shadow-sm' 
                    : 'bg-slate-100 text-slate-600 active:bg-slate-200 md:hover:bg-slate-200'
                }`;
                btn.onclick = () => filterCategory(cat);
                container.appendChild(btn);
            });
        }

        // 4. Kategoriye Göre Filtreleme
        function filterCategory(category) {
            activeCategory = category;
            generateCategoryButtons();
            applyFilters();
        }

        // 5. Kombine Filtreleme
        function applyFilters() {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            
            const filtered = allProjects.filter(project => {
                const matchesCategory = (activeCategory === 'Tümü' || project.kategori === activeCategory);
                const matchesSearch = project.adi.toLowerCase().includes(searchTerm) || 
                                      project.aciklama.toLowerCase().includes(searchTerm);
                
                return matchesCategory && matchesSearch;
            });
            
            renderProjects(filtered);
        }

        // Arama tetikleyicisi
        document.getElementById('searchBar').addEventListener('input', applyFilters);

        // Sayfa açılışında çalıştır
        window.addEventListener('DOMContentLoaded', fetchProjects);
    </script>
</body>
</html>
